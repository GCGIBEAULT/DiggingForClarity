<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digging For Clarity — Private Lab</title>
  <link rel="icon" href="footer_logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    :root{--bg:#f6f7f9;--card:#fff;--accent:#003366;--muted:#6b7280}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Georgia,serif;background:var(--bg);margin:0;color:#0b1220}
    .wrap{max-width:960px;margin:0 auto;padding:20px}
    .masthead{text-align:center;margin-top:28px}
    .masthead h1{font-family:Georgia,serif;color:var(--accent);font-size:2.4rem;margin:0}
    .masthead p{color:var(--muted);margin:6px 0 18px}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="masthead">
      <h1>Digging For Clarity — Private Lab</h1>
      <p>Drama-free news, weather, and community updates with modular clarity.</p>
    </div>

    <div class="grid">

      <!-- BLOCK 1: WEATHER -->
      <section>
        <h2>Local Weather</h2>
        <input id="weatherLink" placeholder="Paste your favorite weather link here">
        <button onclick="openWeather()">Open Weather</button>
      </section>

      <!-- BLOCK 2: LOCAL NEWS -->
      <section>
        <h2>Local News</h2>
        <input id="localNews" placeholder="Local News Link">
        <button onclick="openLocalNews()">Open Local News</button>
      </section>

      <!-- EVERYTHING BELOW THIS POINT REMOVED -->
    </div>
  </div>

  <script>
    function openWeather(){
      const url = document.getElementById('weatherLink').value.trim();
      if(url) window.open(url, '_blank');
    }

    function openLocalNews(){
      const url = document.getElementById('localNews').value.trim();
      if(url) window.open(url, '_blank');
    }
  </script>
</body>
</html>
